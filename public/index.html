<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>College Management System</title>
<style>body{font-family:Arial,sans-serif;background:#f2f5fb;margin:0;color:#17243b}header{background:#173d75;color:white;padding:24px;text-align:center}main{max-width:800px;margin:30px auto;padding:0 16px}.panel{background:white;border-radius:12px;padding:22px;box-shadow:0 3px 14px #0001}input,button{padding:10px;margin:5px 4px 5px 0}button{background:#173d75;color:white;border:0;border-radius:5px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd}</style></head>
<body><header><h1>College Management System</h1><p>Jenkins Assignment 3 Practice Project</p></header><main><section class="panel"><h2>Student Records</h2><p>Add a student to the demo table. Records stay in this browser tab only.</p><form id="form"><input id="roll" placeholder="Roll number" required><input id="name" placeholder="Student name" required><input id="course" placeholder="Course" required><button>Add Student</button></form><table><thead><tr><th>Roll</th><th>Name</th><th>Course</th><th>Action</th></tr></thead><tbody id="students"></tbody></table></section></main>
<script>const rows=[];const tbody=document.getElementById('students');function render(){tbody.replaceChildren();rows.forEach((s,i)=>{const tr=document.createElement('tr');[s.roll,s.name,s.course].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Delete';btn.onclick=()=>{rows.splice(i,1);render()};td.appendChild(btn);tr.appendChild(td);tbody.appendChild(tr)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();rows.push({roll:roll.value,name:document.getElementById('name').value,course:course.value});e.target.reset();render()};</script></body></html>
